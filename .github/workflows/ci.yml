name: CI

# CLI/SDK suites run on every push/PR. The landing image (context: web/ —
# server-rendered Phoenix/Hologram on Bandit) is smoke-built on every run;
# on main ONLY it is pushed to ops.noizu.com as sha-* and the helm values
# are bumped [skip ci]. ArgoCD auto-syncs helm/dirconfig-site @ main.

on:
  push:
    branches: [main, develop, stage]
  pull_request:
    branches: [main, develop, stage]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ops.noizu.com
  IMAGE: ops.noizu.com/dirconfig.therobotlives.com/web

jobs:
  rust-cli:
    name: Rust CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: floating `stable` adds clippy lints each release and turns CI red unprompted.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Tests + line-coverage gate (acceptance 55.65% on 2026-10-07 → gate 50).
      - run: cargo llvm-cov --fail-under-lines 50 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-rust-cli
          path: lcov.info
          if-no-files-found: ignore

  rust-cli-clippy:
    name: Rust CLI clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: floating `stable` adds clippy lints each release and turns CI red unprompted.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  rust-sdk:
    name: Rust SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4
      # Pinned: floating `stable` adds clippy lints each release and turns CI red unprompted.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Acceptance 84.45% on 2026-10-07 → gate 79.
      - run: cargo llvm-cov --fail-under-lines 79 --lcov --output-path lcov.info
      - run: cargo clippy --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-rust-sdk
          path: sdk/rust/lcov.info
          if-no-files-found: ignore

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: pip install -e ".[dev]" pytest-cov
      # Acceptance 66% on 2026-10-07 → gate 61.
      - run: pytest --cov=direnv_config --cov-report=term --cov-report=xml --cov-fail-under=61
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-python-sdk
          path: sdk/python/coverage.xml
          if-no-files-found: ignore

  elixir-sdk:
    name: Elixir SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/elixir
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "26"
          elixir-version: "1.16"
      # mix.lock is gitignored for this library, so key on mix.exs.
      - uses: actions/cache@v4
        with:
          path: |
            sdk/elixir/deps
            sdk/elixir/_build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('sdk/elixir/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      # Threshold lives in mix.exs (test_coverage.summary.threshold).
      - run: mix test --cover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-elixir-sdk
          path: sdk/elixir/cover
          if-no-files-found: ignore

  php-sdk:
    name: PHP SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - run: composer install
      - run: vendor/bin/phpunit

  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      MIX_ENV: test
      # Hologram routes 404 in :test unless this is set.
      HOLOGRAM_START: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: web/.tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            web/deps
            web/_build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('web/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      - run: mix compile
      - run: mix test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-web
          path: web/cover
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # PRs restore the gha cache only; develop/main pushes export it
      # (stops PR cache churn).
      - name: Build landing image
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          load: true
          push: false
          tags: dirconfig-landing:ci
          cache-from: type=gha,scope=web
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=web,mode=max' || '' }}
      - name: Probe /healthz and hero content
        run: |
          docker run -d --name dc-landing -p 8160:8160 dirconfig-landing:ci
          trap 'docker rm -f dc-landing >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8160/healthz | grep -q ok; then
              PAGE=$(curl -fsS http://127.0.0.1:8160/)
              echo "$PAGE" | grep -q "YAML in. Env vars out."
              echo "$PAGE" | grep -q "How it works"
              echo "$PAGE" | grep -q "23 subcommands, one small binary"
              exit 0
            fi
            sleep 1
          done
          echo "landing smoke failed"
          docker logs dc-landing || true
          exit 1

  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-cli, rust-cli-clippy, rust-sdk, typescript-sdk, python-sdk, elixir-sdk, php-sdk, web-test, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require registry secrets
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::REGISTRY_USER / REGISTRY_PASSWORD missing on this repo"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build & push landing
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  bump-chart:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tag
        run: |
          SHORT=${GITHUB_SHA::7}
          sed -i -E "s|(image: ops\.noizu\.com/dirconfig\.therobotlives\.com/web:).*|\1sha-${SHORT}|" helm/dirconfig-site/values.yaml
      - name: Commit & push
        run: |
          git config user.name "dirconfig-site-ci"
          git config user.email "ci@noizu.com"
          git add helm/dirconfig-site/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: deploy sha-${GITHUB_SHA::7} [skip ci]"
          git push

  ci-timing:
    # PR-run timing tracker (fleet standard). Warn-only: never blocks.
    # Thresholds are repo/org Variables PR_STEP_MAX_MINUTES / PR_RUN_MAX_MINUTES, defaults 4/7.
    needs: [rust-cli, rust-sdk, typescript-sdk, python-sdk, elixir-sdk, php-sdk, web-test, smoke]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Track timing thresholds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          STEP_MAX_MIN: ${{ vars.PR_STEP_MAX_MINUTES || '4' }}
          RUN_MAX_MIN: ${{ vars.PR_RUN_MAX_MINUTES || '7' }}
        run: |
          set -euo pipefail
          SUMMARY="$GITHUB_STEP_SUMMARY"
          jobs_json=""
          for i in 1 2 3; do
            jobs_json=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100") && break
            sleep 5
          done
          [ -n "$jobs_json" ] || { echo "::warning title=CI timing::could not fetch run jobs"; exit 0; }
          {
            echo "## CI timing (thresholds: step ${STEP_MAX_MIN}m / run ${RUN_MAX_MIN}m)"
            echo
            echo "| job | step | duration | status |"
            echo "|---|---|---|---|"
          } >> "$SUMMARY"
          flagged=0
          steps_sum=0
          while IFS=$'\t' read -r job step start end; do
            [ -n "$job" ] || continue
            s=$(date -d "$start" +%s); e=$(date -d "$end" +%s)
            dur=$((e - s)); thr=$((STEP_MAX_MIN * 60))
            steps_sum=$((steps_sum + dur))
            if [ "$dur" -gt "$thr" ]; then
              flagged=$((flagged + 1))
              echo "::warning title=CI timing::\"$step\" (job: $job) took $((dur / 60))m$((dur % 60))s — over the ${STEP_MAX_MIN}m step threshold"
              echo "| \`$job\` | \`$step\` | $((dur / 60))m$((dur % 60))s | ⚠️ over ${STEP_MAX_MIN}m |" >> "$SUMMARY"
            else
              echo "| \`$job\` | \`$step\` | $((dur / 60))m$((dur % 60))s | ok |" >> "$SUMMARY"
            fi
          done < <(echo "$jobs_json" | jq -r '
            .jobs[] | select(.name | test("^(rust-cli|rust-cli-clippy|rust-sdk|typescript-sdk|python-sdk|elixir-sdk|php-sdk|web-test|smoke)$")) | .name as $job |
            .steps[] | select(.status == "completed" and .conclusion != "skipped" and .conclusion != null) |
            [$job, .name, .started_at, .completed_at] | @tsv')
          start=$(date -d "$RUN_STARTED_AT" +%s); now=$(date +%s)
          wall=$((now - start)); run_thr=$((RUN_MAX_MIN * 60))
          echo
          echo "| **steps sum** | test jobs, work only | $((steps_sum / 60))m$((steps_sum % 60))s | $( [ "$steps_sum" -gt "$run_thr" ] && echo "⚠️ over ${RUN_MAX_MIN}m" || echo ok) |" >> "$SUMMARY"
          echo "| **wall clock** | queue + work | $((wall / 60))m$((wall % 60))s | info |" >> "$SUMMARY"
          if [ "$steps_sum" -gt "$run_thr" ]; then
            echo "::warning title=CI timing::acceptance steps sum to $((steps_sum / 60))m$((steps_sum % 60))s — over the ${RUN_MAX_MIN}m run threshold (wall clock: $((wall / 60))m)"
          fi
          echo; echo "_${flagged} step(s) over threshold._" >> "$SUMMARY"
