apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dirconfig-site.fullname" . }}
  labels:
    {{- include "dirconfig-site.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "dirconfig-site.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dirconfig-site.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: web
        image: {{ .Values.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.port }}
          protocol: TCP
        env:
        - name: PORT
          value: {{ .Values.port | quote }}
        - name: PHX_HOST
          value: {{ .Values.domain | quote }}
        - name: HOLOGRAM_START
          value: "1"
        # Pin the runtime env explicitly. Hologram.env/0 reads
        # HOLOGRAM_ENV || MIX_ENV and falls back to :dev when neither is set
        # (true in a mix release), which disables the Hologram router and
        # 404s every page — never rely on the image's default alone.
        - name: MIX_ENV
          value: prod
        - name: HOLOGRAM_ENV
          value: prod
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.port }}
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always
